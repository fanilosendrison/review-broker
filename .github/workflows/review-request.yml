name: Review request

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing ReviewRequest issue number
        required: false
        type: number
      qualification_only:
        description: Nonproduction OIDC job qualification only; never a review
        required: false
        type: boolean
        default: false
      qualification_sha:
        description: Exact published dev SHA required for qualification-only dispatch
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: review-broker-single-reviewer
  cancel-in-progress: false

jobs:
  qualification:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.qualification_only == true &&
      github.repository == 'fanilosendrison/review-broker' && github.ref == 'refs/heads/dev' &&
      github.event.repository.default_branch == 'dev' && github.workflow_sha == github.sha &&
      inputs.qualification_sha == github.sha
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QUALIFICATION_ONLY: ${{ inputs.qualification_only }}
      QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
      QUALIFICATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact default-branch qualification source
        run: |
          test "$GITHUB_REPOSITORY" = 'fanilosendrison/review-broker'
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install declared verification dependencies
        run: python -m pip install .
      - name: Qualify one nonproduction OIDC workload identity
        run: python -m review_broker.oidc_qualification
      - name: Retain sanitized OIDC job qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oidc-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: oidc-qualification.json
          if-no-files-found: error
          retention-days: 90
  review:
    permissions:
      actions: read
      contents: write
      issues: write
      id-token: write
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_dispatch' || inputs.qualification_only != true) &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.body, '<!-- review-broker-request:v1 -->') ||
      contains(github.event.issue.body, '<!-- review-broker-request:v2 -->'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BROKER_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      CODESPACE_NAME: ${{ vars.REVIEW_BROKER_CODESPACE_NAME }}
      REVIEW_BROKER_AUTHORIZED_REQUESTERS: ${{ vars.REVIEW_BROKER_AUTHORIZED_REQUESTERS }}
      REVIEW_BROKER_AUTHORIZED_REPOSITORIES: ${{ vars.REVIEW_BROKER_AUTHORIZED_REPOSITORIES }}
      REVIEW_BROKER_PRIVATE_SOURCE_REPOSITORIES: ${{ vars.REVIEW_BROKER_PRIVATE_SOURCE_REPOSITORIES }}
      REVIEW_BROKER_SECURITY_QUALIFIED: ${{ vars.REVIEW_BROKER_SECURITY_QUALIFIED }}
      REVIEW_BROKER_SECURITY_EVIDENCE_ID: ${{ vars.REVIEW_BROKER_SECURITY_EVIDENCE_ID }}
      REVIEW_BROKER_V2_ENABLED: ${{ vars.REVIEW_BROKER_V2_ENABLED }}
      REVIEW_BROKER_LOW_SENSITIVITY_V1_ENABLED: ${{ vars.REVIEW_BROKER_LOW_SENSITIVITY_V1_ENABLED }}
      REVIEW_BROKER_LOW_SENSITIVITY_V1_ADMITTED_SHA: ${{ vars.REVIEW_BROKER_LOW_SENSITIVITY_V1_ADMITTED_SHA }}
      REVIEW_BROKER_LOW_SENSITIVITY_V1_REPOSITORIES: ${{ vars.REVIEW_BROKER_LOW_SENSITIVITY_V1_REPOSITORIES }}
      REVIEW_BROKER_BOUNDED_PRIVATE_V1_ENABLED: ${{ vars.REVIEW_BROKER_BOUNDED_PRIVATE_V1_ENABLED }}
      REVIEW_BROKER_BOUNDED_PRIVATE_V1_ADMITTED_SHA: ${{ vars.REVIEW_BROKER_BOUNDED_PRIVATE_V1_ADMITTED_SHA }}
      REVIEW_BROKER_BOUNDED_PRIVATE_V1_REQUESTER: ${{ vars.REVIEW_BROKER_BOUNDED_PRIVATE_V1_REQUESTER }}
      REVIEW_BROKER_BOUNDED_PRIVATE_V1_REPOSITORY: ${{ vars.REVIEW_BROKER_BOUNDED_PRIVATE_V1_REPOSITORY }}
      REVIEW_BROKER_BOUNDED_PRIVATE_V1_PULL_REQUEST: ${{ vars.REVIEW_BROKER_BOUNDED_PRIVATE_V1_PULL_REQUEST }}
      REVIEW_BROKER_BOUNDED_PRIVATE_V1_EXPECTED_HEAD: ${{ vars.REVIEW_BROKER_BOUNDED_PRIVATE_V1_EXPECTED_HEAD }}
      REVIEW_BROKER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REMOTE_ROOT: /tmp/review-broker-${{ github.run_id }}-${{ github.run_attempt }}
      CODEX_RUNTIME_ROOT: /var/lib/review-broker/codex-0.164.0-linux-x64
    steps:
      - name: Validate manual ReviewRequest selector before admission
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python - <<'PY'
          import os
          import re
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              if not re.fullmatch('[1-9][0-9]*', os.environ.get('MANUAL_ISSUE_NUMBER', '')):
                  raise SystemExit('MANUAL_ISSUE_NUMBER_INVALID')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install and package trusted broker
        run: |
          python -m pip install .
          mkdir -m 700 broker-dist
          python -m pip wheel --no-deps --wheel-dir broker-dist .
          wheel_count="$(find broker-dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')"
          test "$wheel_count" = "1"
          wheel_path="$(find broker-dist -maxdepth 1 -type f -name '*.whl')"
          wheel_name="$(basename "$wheel_path")"
          wheel_sha256="$(sha256sum "$wheel_path" | cut -d ' ' -f 1)"
          printf '%s\n' "$wheel_sha256" > broker-dist/broker-wheel.sha256
          cp src/review_broker/schemas/reviewer-findings-v1.codex-wire.schema.json \
            broker-dist/reviewer-findings-v1.codex-wire.schema.json
          schema_sha256="$(sha256sum broker-dist/reviewer-findings-v1.codex-wire.schema.json | cut -d ' ' -f 1)"
          printf '%s\n' "$schema_sha256" > broker-dist/reviewer-schema.sha256
          echo "BROKER_WHEEL_NAME=$wheel_name" >> "$GITHUB_ENV"
          echo "BROKER_WHEEL_SHA256=$wheel_sha256" >> "$GITHUB_ENV"
          echo "REVIEWER_SCHEMA_SHA256=$schema_sha256" >> "$GITHUB_ENV"
      - name: Mint bounded private-source read token
        id: source_auth
        if: vars.REVIEW_BROKER_SOURCE_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.REVIEW_BROKER_SOURCE_APP_ID }}
          private-key: ${{ secrets.REVIEW_BROKER_SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-pull-requests: read
          permission-metadata: read
      - name: Admit and prepare immutable packet
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BROKER_PRIVATE_SOURCE_REPOSITORIES: ${{ vars.REVIEW_BROKER_PRIVATE_SOURCE_REPOSITORIES }}
          REVIEW_BROKER_SOURCE_TOKEN: ${{ steps.source_auth.outputs.token }}
        run: |
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-prepare \
            --issue "$ISSUE_NUMBER" --output evidence > prepare-output.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open("prepare-output.json", encoding="utf-8"))
          print("duplicate=" + str(value["duplicate"]).lower())
          print("admission_mode=" + value["admission_mode"])
          if not value["duplicate"]:
              print("request_id=" + value["attempt"]["request_id"])
              print("attempt_id=" + value["attempt"]["attempt_id"])
              print("packet_id=" + value["packet"]["packet_id"])
          PY
      - name: Quarantine unsafe prepared packet
        id: prepared_quarantine
        if: steps.prepare.outputs.duplicate == 'false'
        run: |
          reviewctl internal-quarantine-evidence --evidence-dir evidence \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}' > prepared-quarantine.json
          test "$(python -c 'import json; print(json.load(open("prepared-quarantine.json"))["contaminated"])')" = False || {
            echo "CREDENTIAL_SHAPED_MATERIAL_QUARANTINED"; exit 1;
          }
      - name: Preserve prepared packet
        if: steps.prepare.outputs.duplicate == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
      - name: Assess exact rendered-input capacity before lifecycle
        id: capacity
        if: steps.prepare.outputs.duplicate == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-input-capacity \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --packet-id '${{ steps.prepare.outputs.packet_id }}' \
            --packet-dir evidence \
            --executing-broker-sha "$GITHUB_SHA" > evidence/input-capacity.json
      - name: Enforce selected operational admission
        if: steps.prepare.outputs.duplicate == 'false'
        env:
          ADMISSION_MODE: ${{ steps.prepare.outputs.admission_mode }}
          SECURITY_QUALIFIED: ${{ vars.REVIEW_BROKER_SECURITY_QUALIFIED }}
          SECURITY_EVIDENCE: ${{ vars.REVIEW_BROKER_SECURITY_EVIDENCE_ID }}
          CODESPACE_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
        run: |
          if test "$ADMISSION_MODE" = "comprehensive-security"; then
            test "$SECURITY_QUALIFIED" = "true" || { echo "SECURITY_BOUNDARY_NOT_QUALIFIED"; exit 1; }
            test -n "$SECURITY_EVIDENCE" || { echo "SECURITY_EVIDENCE_MISSING"; exit 1; }
          else
            test "$ADMISSION_MODE" = "low-sensitivity-v1" -o \
              "$ADMISSION_MODE" = "bounded-private-v1" || {
                echo "OPERATIONAL_ADMISSION_INVALID"; exit 1;
              }
          fi
          test -n "$CODESPACE_TOKEN" || { echo "CODESPACE_CREDENTIAL_MISSING"; exit 1; }
          test -n "$CODESPACE_NAME" || { echo "CODESPACE_NAME_MISSING"; exit 1; }
      - name: Start and observe dedicated Codespace
        id: start
        if: steps.prepare.outputs.duplicate == 'false'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from review_broker.codespace_identity import capture_recipient
          capture_recipient(Path(os.environ['RUNNER_TEMP']) / 'review-broker-recipient.json',
              selection=os.environ['CODESPACE_NAME'], repository=os.environ['GITHUB_REPOSITORY'],
              repository_id=os.environ['GITHUB_REPOSITORY_ID'])
          PY
          echo "start_requested=true" >> "$GITHUB_OUTPUT"
          gh api --method POST "user/codespaces/$CODESPACE_NAME/start" --silent
          for attempt in $(seq 1 30); do
            state="$(gh codespace view -c "$CODESPACE_NAME" --json state --jq .state)"
            if test "$state" = "Available"; then
              python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from review_broker.codespace_identity import revalidate_recipient
          identity = revalidate_recipient(Path(os.environ['RUNNER_TEMP']) / 'review-broker-recipient.json',
              selection=os.environ['CODESPACE_NAME'], repository=os.environ['GITHUB_REPOSITORY'],
              repository_id=os.environ['GITHUB_REPOSITORY_ID'])
          print('codespace_id=' + str(identity.codespace_id))
          PY
              exit 0
            fi
            sleep 5
          done
          echo "CODESPACE_AVAILABLE_NOT_OBSERVED"
          exit 1
      - name: Transfer and verify packet inside Codespace
        if: steps.prepare.outputs.duplicate == 'false'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
        run: |
          gh codespace ssh -c "$CODESPACE_NAME" -- mkdir -m 700 "$REMOTE_ROOT"
          gh codespace cp -c "$CODESPACE_NAME" -r -- -O \
            evidence broker-dist "remote:$REMOTE_ROOT"
          remote_wheel="$REMOTE_ROOT/broker-dist/$BROKER_WHEEL_NAME"
          observed_wheel_sha256="$(gh codespace ssh -c "$CODESPACE_NAME" -- \
            sha256sum "$remote_wheel" | cut -d ' ' -f 1)"
          test "$observed_wheel_sha256" = "$BROKER_WHEEL_SHA256"
          observed_schema_sha256="$(gh codespace ssh -c "$CODESPACE_NAME" -- \
            sha256sum "$REMOTE_ROOT/broker-dist/reviewer-findings-v1.codex-wire.schema.json" | cut -d ' ' -f 1)"
          test "$observed_schema_sha256" = "$REVIEWER_SCHEMA_SHA256"
          gh codespace ssh -c "$CODESPACE_NAME" -- \
            python3 -m pip install --user --no-deps --force-reinstall "$remote_wheel"
          gh codespace ssh -c "$CODESPACE_NAME" -- \
            env -u PYTHONPATH python3 -P -m review_broker.cli internal-install-reviewer-profile \
            --trusted-workspace /workspaces/review-broker \
            --packet-dir "$REMOTE_ROOT/evidence"
          gh codespace ssh -c "$CODESPACE_NAME" -- \
            env -u PYTHONPATH python3 -P -m review_broker.cli internal-preflight-codex-runtime \
            --runtime-root "$CODEX_RUNTIME_ROOT" \
            > evidence/codex-runtime-preflight.json
          gh codespace ssh -c "$CODESPACE_NAME" -- \
            env -u PYTHONPATH python3 -P -m review_broker.cli internal-verify-packet \
            --packet-dir "$REMOTE_ROOT/evidence" \
            --expected-packet-id '${{ steps.prepare.outputs.packet_id }}' > /dev/null
      - name: Verify bounded low-sensitivity pre-arm evidence
        if: >-
          steps.prepare.outputs.duplicate == 'false' &&
          (steps.prepare.outputs.admission_mode == 'low-sensitivity-v1' ||
          steps.prepare.outputs.admission_mode == 'bounded-private-v1')
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
          EXPECTED_CODESPACE_ID: ${{ steps.start.outputs.codespace_id }}
          ATTEMPT_ID: ${{ steps.prepare.outputs.attempt_id }}
          PACKET_ID: ${{ steps.prepare.outputs.packet_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from review_broker.codespace_identity import context_command, revalidate_recipient
          identity = revalidate_recipient(Path(os.environ['RUNNER_TEMP']) / 'review-broker-recipient.json',
              expected_id=os.environ['EXPECTED_CODESPACE_ID'], selection=os.environ['CODESPACE_NAME'],
              repository=os.environ['GITHUB_REPOSITORY'], repository_id=os.environ['GITHUB_REPOSITORY_ID'])
          root = os.environ['REMOTE_ROOT']
          command = ['python3', '-P', '-m', 'review_broker.cli', 'internal-bounded-v1-preflight',
              '--packet-dir', root + '/evidence',
              '--schema', root + '/broker-dist/reviewer-findings-v1.codex-wire.schema.json',
              '--attempt', os.environ['ATTEMPT_ID'], '--packet-id', os.environ['PACKET_ID'],
              '--broker-wheel-sha256', os.environ['BROKER_WHEEL_SHA256'],
              '--trusted-workspace', '/workspaces/review-broker',
              '--codex-runtime-root', os.environ['CODEX_RUNTIME_ROOT'],
              '--executing-broker-sha', os.environ['GITHUB_SHA']]
          with Path('evidence/bounded-v1-preflight.json').open('wb') as receipt:
              subprocess.run(['gh', 'codespace', 'ssh', '-c', identity.name, '--',
                  context_command(identity, command)], stdout=receipt, check=True)
          PY
      - name: Run comprehensive reviewer isolation probe
        if: >-
          steps.prepare.outputs.duplicate == 'false' &&
          steps.prepare.outputs.admission_mode == 'comprehensive-security'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
        run: |
          gh codespace ssh -c "$CODESPACE_NAME" -- \
            env -u PYTHONPATH python3 -P -m review_broker.cli internal-probe-reviewer-profile \
            --trusted-workspace /workspaces/review-broker \
            --packet-dir "$REMOTE_ROOT/evidence" \
            --codex-runtime-root "$CODEX_RUNTIME_ROOT" \
            > evidence/reviewer-security-probe.json
      - name: Durably arm exactly one invocation
        id: arm
        if: steps.prepare.outputs.duplicate == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-arm-authorize \
            --codespace-name "$CODESPACE_NAME" \
            --codespace-id '${{ steps.start.outputs.codespace_id }}' \
            --authorization-file "$RUNNER_TEMP/review-broker-arm-authorization.json" \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --packet-id '${{ steps.prepare.outputs.packet_id }}' \
            --packet-dir evidence \
            --executing-broker-sha "$GITHUB_SHA"
      - name: Invoke Codex once
        id: invoke
        if: steps.prepare.outputs.duplicate == 'false' && steps.arm.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
          EXPECTED_CODESPACE_ID: ${{ steps.start.outputs.codespace_id }}
          ATTEMPT_ID: ${{ steps.prepare.outputs.attempt_id }}
          PACKET_ID: ${{ steps.prepare.outputs.packet_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from review_broker.codespace_identity import context_command, revalidate_recipient
          identity = revalidate_recipient(Path(os.environ['RUNNER_TEMP']) / 'review-broker-recipient.json',
              expected_id=os.environ['EXPECTED_CODESPACE_ID'], selection=os.environ['CODESPACE_NAME'],
              repository=os.environ['GITHUB_REPOSITORY'], repository_id=os.environ['GITHUB_REPOSITORY_ID'])
          root = os.environ['REMOTE_ROOT']
          command = ['python3', '-P', '-m', 'review_broker.cli', 'internal-invoke',
              '--packet-dir', root + '/evidence',
              '--schema', root + '/broker-dist/reviewer-findings-v1.codex-wire.schema.json',
              '--attempt', os.environ['ATTEMPT_ID'], '--packet-id', os.environ['PACKET_ID'],
              '--broker-wheel-sha256', os.environ['BROKER_WHEEL_SHA256'],
              '--trusted-workspace', '/workspaces/review-broker',
              '--codex-runtime-root', os.environ['CODEX_RUNTIME_ROOT'], '--authorization-stdin']
          with (Path(os.environ['RUNNER_TEMP']) / 'review-broker-arm-authorization.json').open('rb') as bundle:
              subprocess.run(['gh', 'codespace', 'ssh', '-c', identity.name, '--',
                  context_command(identity, command)], stdin=bundle, check=True)
          PY
      - name: Recover available runtime evidence
        id: recover
        if: steps.prepare.outputs.duplicate == 'false' && always() && steps.start.outputs.start_requested == 'true'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
        run: |
          reviewctl internal-recover \
            --codespace "$CODESPACE_NAME" \
            --remote-dir "$REMOTE_ROOT/evidence" \
            --output evidence \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}'
      - name: Quarantine detected runtime material
        id: runtime_quarantine
        if: steps.prepare.outputs.duplicate == 'false' && always() && steps.start.outputs.start_requested == 'true'
        run: |
          reviewctl internal-quarantine-evidence --evidence-dir evidence \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}' > runtime-quarantine.json
      - name: Establish complete terminal capture
        id: capture
        if: steps.prepare.outputs.duplicate == 'false' && always() && steps.arm.outcome == 'success' && steps.runtime_quarantine.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-capture-terminal \
            --packet-dir evidence \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}' \
            --packet-id '${{ steps.prepare.outputs.packet_id }}'
      - name: Plan durable terminal evidence artifact
        if: steps.prepare.outputs.duplicate == 'false' && steps.capture.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-plan-evidence-artifact \
            --evidence-dir evidence \
            --output evidence-artifact-plan.json \
            --artifact-name "terminal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Recheck terminal artifact for contamination
        if: steps.prepare.outputs.duplicate == 'false' && steps.capture.outcome == 'success'
        run: |
          reviewctl internal-quarantine-evidence --evidence-dir evidence \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}' > terminal-quarantine.json
          test "$(python -c 'import json; print(json.load(open("terminal-quarantine.json"))["contaminated"])')" = False || {
            echo "CREDENTIAL_SHAPED_MATERIAL_QUARANTINED"; exit 1;
          }
      - name: Upload durable terminal evidence artifact
        id: terminal_artifact
        if: steps.prepare.outputs.duplicate == 'false' && steps.capture.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
      - name: Bind durable terminal evidence locator
        if: steps.prepare.outputs.duplicate == 'false' && steps.capture.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-finalize-evidence-artifact \
            --plan evidence-artifact-plan.json \
            --output evidence-artifact-locator.json \
            --artifact-id '${{ steps.terminal_artifact.outputs.artifact-id }}' \
            --artifact-digest '${{ steps.terminal_artifact.outputs.artifact-digest }}'
      - name: Preserve ambiguous execution as indeterminate
        id: indeterminate
        if: steps.prepare.outputs.duplicate == 'false' && always() && steps.arm.outcome == 'success' && steps.capture.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-mark-indeterminate \
            --recovery-manifest evidence/recovery-manifest.json \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}'
      - name: Validate captured evidence
        id: validation
        if: steps.prepare.outputs.duplicate == 'false' && steps.capture.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl internal-validate --packet-dir evidence
          validation_id="artifact:sha256:$(sha256sum evidence/validation.json | cut -d' ' -f1)"
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-transition \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --state VALIDATED --evidence "$validation_id"
      - name: Publish bounded result
        id: publish
        if: steps.prepare.outputs.duplicate == 'false' && steps.validation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BROKER_SOURCE_TOKEN: ${{ steps.source_auth.outputs.token }}
        run: reviewctl --broker-repo "$BROKER_REPOSITORY" internal-publish --packet-dir evidence
      - name: Stop and independently observe Shutdown
        id: stop
        if: steps.prepare.outputs.duplicate == 'false' && always() && steps.start.outputs.start_requested == 'true'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
        run: |
          reviewctl internal-stop-codespace \
            --codespace "$CODESPACE_NAME" \
            --output evidence \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}'
      - name: Record stopped state from observed evidence
        if: >-
          steps.prepare.outputs.duplicate == 'false' && always() &&
          steps.stop.outcome == 'success' &&
          (steps.publish.outcome == 'success' || steps.indeterminate.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl --broker-repo "$BROKER_REPOSITORY" internal-record-stopped \
            --observation evidence/shutdown-observation.json \
            --codespace "$CODESPACE_NAME" \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}'
      - name: Recheck all recovered evidence before final artifact
        id: final_quarantine
        if: steps.prepare.outputs.duplicate == 'false' && always()
        run: |
          reviewctl internal-quarantine-evidence --evidence-dir evidence \
            --request '${{ steps.prepare.outputs.request_id }}' \
            --attempt '${{ steps.prepare.outputs.attempt_id }}' > final-quarantine.json
      - name: Preserve recovered evidence
        if: steps.prepare.outputs.duplicate == 'false' && always() && steps.final_quarantine.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence
            evidence-artifact-plan.json
            evidence-artifact-locator.json
          if-no-files-found: error
          retention-days: 90
