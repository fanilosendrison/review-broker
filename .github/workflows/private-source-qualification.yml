name: Private source qualification

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: review-broker-private-source-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint dedicated private-source token
        id: source_auth
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.REVIEW_BROKER_SOURCE_APP_ID }}
          private-key: ${{ secrets.REVIEW_BROKER_SOURCE_APP_PRIVATE_KEY }}
          owner: fanilosendrison
          permission-contents: read
          permission-pull-requests: read
          permission-metadata: read

      - name: Qualify exact read-only source acquisition
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source_auth.outputs.token }}
          GITHUB_TOKEN: ""
          REVIEW_BROKER_CODESPACE_TOKEN: ""
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: "!gh auth git-credential"
          EXPECTED_REPOSITORY: fanilosendrison/review-broker
          EXPECTED_PULL_REQUEST: "45"
          EXPECTED_HEAD: d728086bd8faf082e5b2725a59c21cc6ab2b55ea
          EXPECTED_PATH: docs/architecture/requester-owned-mission-decision-proposal.md
          SOURCE_APP_SLUG: ${{ steps.source_auth.outputs.app-slug }}
          SOURCE_INSTALLATION_ID: ${{ steps.source_auth.outputs.installation-id }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          test -n "$GH_TOKEN"
          test -z "$GITHUB_TOKEN"
          test -z "$REVIEW_BROKER_CODESPACE_TOKEN"
          test -n "$SOURCE_APP_SLUG"
          test -n "$SOURCE_INSTALLATION_ID"

          source_subprocess() (
            export HOME="$source_home"
            export XDG_CONFIG_HOME="$source_config"
            for variable in $(compgen -e); do
              case "$variable" in
                HOME|PATH|XDG_CONFIG_HOME|SSL_CERT_FILE|SSL_CERT_DIR|GH_TOKEN|GIT_CONFIG_NOSYSTEM|GIT_CONFIG_GLOBAL|GIT_TERMINAL_PROMPT|GIT_CONFIG_COUNT|GIT_CONFIG_KEY_0|GIT_CONFIG_VALUE_0|GIT_CONFIG_KEY_1|GIT_CONFIG_VALUE_1) ;;
                *) unset "$variable" ;;
              esac
            done
            exec "$@"
          )
          local_subprocess() (
            unset GH_TOKEN GITHUB_TOKEN REVIEW_BROKER_CODESPACE_TOKEN
            exec "$@"
          )

          qualification_root="$(local_subprocess mktemp -d)"
          source_home="$qualification_root/home"
          source_config="$qualification_root/xdg"
          local_subprocess mkdir -m 700 "$source_home" "$source_config"
          cleanup() {
            unset GH_TOKEN GITHUB_TOKEN REVIEW_BROKER_CODESPACE_TOKEN
            rm -rf "$qualification_root"
          }
          trap cleanup EXIT

          test "$(source_subprocess gh auth token)" = "$GH_TOKEN"

          source_subprocess gh api "installation/repositories?per_page=100" \
            > "$qualification_root/installation.json"
          test "$(local_subprocess jq -r '.total_count' "$qualification_root/installation.json")" = "1"
          test "$(local_subprocess jq -r '.repositories | length' "$qualification_root/installation.json")" = "1"
          test "$(local_subprocess jq -r '.repositories[0].full_name' "$qualification_root/installation.json")" \
            = "$EXPECTED_REPOSITORY"

          source_subprocess gh api "repos/$EXPECTED_REPOSITORY" \
            > "$qualification_root/repository.json"
          test "$(local_subprocess jq -r '.full_name' "$qualification_root/repository.json")" \
            = "$EXPECTED_REPOSITORY"
          test "$(local_subprocess jq -r '.visibility' "$qualification_root/repository.json")" = "private"
          test "$(local_subprocess jq -r '.private' "$qualification_root/repository.json")" = "true"

          source_subprocess gh api "repos/$EXPECTED_REPOSITORY/pulls/$EXPECTED_PULL_REQUEST" \
            > "$qualification_root/pull-request.json"
          test "$(local_subprocess jq -r '.state' "$qualification_root/pull-request.json")" = "open"
          head_commit="$(local_subprocess jq -r '.head.sha' "$qualification_root/pull-request.json")"
          base_commit="$(local_subprocess jq -r '.base.sha' "$qualification_root/pull-request.json")"
          test "$head_commit" = "$EXPECTED_HEAD"
          test "$base_commit" != "null"

          source_subprocess gh api \
            "repos/$EXPECTED_REPOSITORY/compare/$base_commit...$head_commit" \
            > "$qualification_root/compare.json"
          merge_base="$(local_subprocess jq -r '.merge_base_commit.sha' "$qualification_root/compare.json")"
          test "$merge_base" != "null"

          source_subprocess gh api \
            "repos/$EXPECTED_REPOSITORY/pulls/$EXPECTED_PULL_REQUEST/files?per_page=100" \
            > "$qualification_root/files.json"
          test "$(local_subprocess jq -r 'length' "$qualification_root/files.json")" = "1"
          test "$(local_subprocess jq -r '.[0].filename' "$qualification_root/files.json")" \
            = "$EXPECTED_PATH"
          api_status="$(local_subprocess jq -r '.[0].status' "$qualification_root/files.json")"
          test "$api_status" = "added"

          expected_remote="https://github.com/$EXPECTED_REPOSITORY.git"
          source_subprocess gh repo clone \
            "$expected_remote" "$qualification_root/source.git" -- \
            --filter=blob:none --no-checkout
          test "$(source_subprocess git -C "$qualification_root/source.git" remote get-url origin)" \
            = "$expected_remote"
          case "$expected_remote" in
            *"$GH_TOKEN"*) echo "SOURCE_TOKEN_IN_REMOTE_URL"; exit 1 ;;
          esac
          for commit in "$base_commit" "$head_commit" "$merge_base"; do
            source_subprocess git -C "$qualification_root/source.git" \
              fetch origin "$commit" --depth=1
          done

          mapfile -d '' changed_paths < <(
            source_subprocess git -C "$qualification_root/source.git" diff --name-only -z \
              "$merge_base" "$head_commit"
          )
          test "${#changed_paths[@]}" = "1"
          test "${changed_paths[0]}" = "$EXPECTED_PATH"
          git_status="$(source_subprocess git -C "$qualification_root/source.git" \
            diff --name-status "$merge_base" "$head_commit" -- "$EXPECTED_PATH")"
          test "$git_status" = $'A\t'"$EXPECTED_PATH"

          if source_subprocess git -C "$qualification_root/source.git" cat-file -e \
            "$merge_base:$EXPECTED_PATH" 2>/dev/null; then
            echo "UNEXPECTED_ADDED_FILE_PREIMAGE"
            exit 1
          fi
          source_subprocess git -C "$qualification_root/source.git" cat-file -e \
            "$head_commit:$EXPECTED_PATH"
          postimage_hash_output="$(
            source_subprocess git -C "$qualification_root/source.git" show \
              "$head_commit:$EXPECTED_PATH" | local_subprocess sha256sum
          )"
          postimage_sha256="${postimage_hash_output%% *}"
          diff_hash_output="$(
            source_subprocess git -C "$qualification_root/source.git" diff \
              --binary --full-index --no-ext-diff --no-textconv \
              --find-renames --find-copies-harder \
              "$merge_base" "$head_commit" -- | local_subprocess sha256sum
          )"
          diff_sha256="${diff_hash_output%% *}"
          test "${#postimage_sha256}" = "64"
          test "${#diff_sha256}" = "64"

          echo "QUALIFICATION_DISPOSITION=PASS"
          echo "SOURCE_APP_SLUG=$SOURCE_APP_SLUG"
          echo "SOURCE_INSTALLATION_ID=$SOURCE_INSTALLATION_ID"
          echo "INSTALLATION_REPOSITORY_SCOPE=$EXPECTED_REPOSITORY"
          echo "REPOSITORY_VISIBILITY=private"
          echo "PULL_REQUEST=$EXPECTED_PULL_REQUEST"
          echo "BASE_COMMIT=$base_commit"
          echo "HEAD_COMMIT=$head_commit"
          echo "MERGE_BASE_COMMIT=$merge_base"
          echo "CHANGED_FILE=$EXPECTED_PATH"
          echo "PREIMAGE_SHA256=NOT_APPLICABLE_ADDED_FILE"
          echo "POSTIMAGE_SHA256=$postimage_sha256"
          echo "DIFF_SHA256=$diff_sha256"
          echo "CREDENTIAL_BOUNDARY=DEDICATED_SOURCE_APP_TOKEN_ONLY"
