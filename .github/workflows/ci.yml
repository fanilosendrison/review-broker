name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e65e4db932cb59d7a0fcfbd442ba19e548fc141d
          path: artifacts/pr72-test-checkout
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact PR72 test fixture
        run: |
          set -euo pipefail
          CANDIDATE="artifacts/pr72-test-checkout"
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = \
            "e65e4db932cb59d7a0fcfbd442ba19e548fc141d"
          test "$(git -C "$CANDIDATE" rev-parse 'HEAD^{tree}')" = \
            "420a18d006e421e197d23b8e93681376fbabc2db"
          test "$(git -C "$CANDIDATE" rev-parse --abbrev-ref HEAD)" = "HEAD"
      - name: Install
        run: python -m pip install '.[test]'
      - name: Unit and adversarial tests
        env:
          REVIEW_BROKER_PR72_TEST_CHECKOUT: ${{ github.workspace }}/artifacts/pr72-test-checkout
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src
      - name: Validate JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in (Path("schemas"), Path("profiles"), Path("programs")):
              for path in root.glob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  print(path)
          PY
