name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e65e4db932cb59d7a0fcfbd442ba19e548fc141d
          path: artifacts/pr72-test-checkout
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact PR72 test fixture
        run: |
          set -euo pipefail
          CANDIDATE="artifacts/pr72-test-checkout"
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = \
            "e65e4db932cb59d7a0fcfbd442ba19e548fc141d"
          test "$(git -C "$CANDIDATE" rev-parse 'HEAD^{tree}')" = \
            "420a18d006e421e197d23b8e93681376fbabc2db"
          test "$(git -C "$CANDIDATE" rev-parse --abbrev-ref HEAD)" = "HEAD"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f3f24d942ad13d368975843f4796b1943dc7cdcb
          path: artifacts/issue83-baseline-workflow
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Issue83 historical workflow fixture
        run: |
          set -euo pipefail
          CANDIDATE="artifacts/issue83-baseline-workflow"
          WORKFLOW=".github/workflows/review-request.yml"
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = \
            "f3f24d942ad13d368975843f4796b1943dc7cdcb"
          test "$(git -C "$CANDIDATE" rev-parse 'HEAD^{tree}')" = \
            "acc12a1ee8ef01166ac44fe184d575585d6a0956"
          test "$(git -C "$CANDIDATE" rev-parse --abbrev-ref HEAD)" = "HEAD"
          test -f "$CANDIDATE/$WORKFLOW"
          test ! -L "$CANDIDATE/$WORKFLOW"
          test "$(git -C "$CANDIDATE" rev-parse "HEAD:$WORKFLOW")" = \
            "806f543b04aa53c0aaa1f69d216f36dbe9460150"
          test "$(git -C "$CANDIDATE" hash-object --no-filters "$WORKFLOW")" = \
            "806f543b04aa53c0aaa1f69d216f36dbe9460150"
      - name: Install
        run: python -m pip install '.[test]'
      - name: Qualify launcher on Node24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Acquire exact public Artifact helper fixture (never executed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: actions/upload-artifact
          ref: cf430e030ddbb5b0abf93d22962f4752f3646cd9
          path: artifacts/v3-upload-artifact
          persist-credentials: false
      - name: Protect Artifact helper fixture
        run: chmod 700 artifacts/v3-upload-artifact
      - name: Unit and adversarial tests
        env:
          REVIEW_BROKER_PR72_TEST_CHECKOUT: ${{ github.workspace }}/artifacts/pr72-test-checkout
          REVIEW_BROKER_ISSUE83_BASELINE_WORKFLOW_CHECKOUT: ${{ github.workspace }}/artifacts/issue83-baseline-workflow
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src
      - name: Validate JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in (Path("schemas"), Path("profiles"), Path("programs")):
              for path in root.glob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  print(path)
          PY
