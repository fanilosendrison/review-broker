name: V3 authenticated source adapter qualification

on:
  repository_dispatch:
    types: [review-broker-v3-source-adapter-qualification]

permissions: {}

concurrency:
  group: review-broker-v3-source-adapter-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'fanilosendrison/review-broker' &&
      github.event.repository.id == 1433701208 &&
      github.event.repository.default_branch == 'dev' &&
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'review-broker-v3-source-adapter-qualification' &&
      github.ref == 'refs/heads/dev' &&
      github.event.sender.id == 30498238 &&
      github.actor == 'fanilosendrison' &&
      github.triggering_actor == 'fanilosendrison' &&
      vars.REVIEW_BROKER_V3_ADAPTER_QUALIFICATION_SHA != '' &&
      github.sha == vars.REVIEW_BROKER_V3_ADAPTER_QUALIFICATION_SHA &&
      vars.REVIEW_BROKER_SOURCE_APP_ID == '5529772'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e65e4db932cb59d7a0fcfbd442ba19e548fc141d
          path: candidate-v3
          persist-credentials: false
      - name: Prepare credential-free exact experimental closure
        env:
          APPROVED_SOURCE_SHA: ${{ vars.REVIEW_BROKER_V3_ADAPTER_QUALIFICATION_SHA }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          test "$GITHUB_SHA" = "$APPROVED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate-v3 rev-parse HEAD)" = "e65e4db932cb59d7a0fcfbd442ba19e548fc141d"
          test "$(git -C candidate-v3 rev-parse 'HEAD^{tree}')" = "420a18d006e421e197d23b8e93681376fbabc2db"
          python scripts/qualification/v3_source_adapter_live.py --verify-code
          python -m venv .qualification-venv
          .qualification-venv/bin/python -m pip install 'jsonschema==4.26.0' 'rfc8785==0.1.4'
          .qualification-venv/bin/python scripts/qualification/v3_source_adapter_live.py --preflight
          echo "$GITHUB_WORKSPACE/.qualification-venv/bin" >> "$GITHUB_PATH"
      - name: Mint repository-scoped v3 source read token
        id: source_auth
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.REVIEW_BROKER_SOURCE_APP_ID }}
          private-key: ${{ secrets.REVIEW_BROKER_SOURCE_APP_PRIVATE_KEY }}
          owner: fanilosendrison
          repositories: review-broker
          permission-contents: read
          permission-pull-requests: read
          permission-metadata: read
          permission-issues: read
      - name: Qualify actual pinned authenticated adapters
        env:
          REVIEW_BROKER_SOURCE_TOKEN: ${{ steps.source_auth.outputs.token }}
          SOURCE_APP_SLUG: ${{ steps.source_auth.outputs.app-slug }}
          SOURCE_INSTALLATION_ID: ${{ steps.source_auth.outputs.installation-id }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          REVIEW_BROKER_JOURNAL_TOKEN: ""
          REVIEW_BROKER_PUBLISH_TOKEN: ""
          REVIEW_BROKER_CODESPACES_TOKEN: ""
          REVIEW_BROKER_SOURCE_APP_PRIVATE_KEY: ""
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ""
          PYTHONNOUSERSITE: "1"
        run: python scripts/qualification/v3_source_adapter_live.py
