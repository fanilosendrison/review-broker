name: Review reconciler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: review-broker-single-reviewer
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Discover durable attempts and stranded Codespace
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BROKER_CODESPACE_TOKEN }}
          CODESPACE_NAME: ${{ vars.REVIEW_BROKER_CODESPACE_NAME }}
        run: |
          test -n "$GH_TOKEN" || { echo "CODESPACE_CREDENTIAL_MISSING"; exit 1; }
          test -n "$CODESPACE_NAME" || { echo "CODESPACE_NAME_MISSING"; exit 1; }
          reviewctl --broker-repo "$GITHUB_REPOSITORY" internal-reconcile \
            --codespace "$CODESPACE_NAME" | tee reconciliation.json
      - name: Preserve reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: reconciliation.json
          if-no-files-found: error
          retention-days: 90
