name: RB91 Q3 — exact orphan cleanup

on:
  push:
    branches:
      - qualification/rb91-q3-graphql-20261107
    paths:
      - .rb91-q3/cleanup-trigger.txt

permissions:
  contents: write

jobs:
  cleanup-one:
    if: >-
      github.repository == 'fanilosendrison/review-broker' &&
      github.ref == 'refs/heads/qualification/rb91-q3-graphql-20261107' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact sacrificial ref and delete with GraphQL expected-old
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          REPO=fanilosendrison/review-broker
          REF='refs/heads/qualification/rb91-q3-data-42372040946-1-a3c5088ae94c773e-race'
          BEFORE='8eebb758755f6f40d30c88fcab94f1640afc4f5a'
          PARENT='6ccb71b7304f2afb43dcd4abaf0798cc476c49cb'
          mkdir -p rb91-q3-orphan-cleanup
          test "$(gh api "repos/${REPO}/git/ref/${REF#refs/}" --jq '.object.sha')" = "$BEFORE"
          test "$(gh api "repos/${REPO}/git/commits/${BEFORE}" --jq '.parents[0].sha')" = "$PARENT"
          identity="$(gh api graphql -f query='query{repository(owner:"fanilosendrison",name:"review-broker"){id databaseId nameWithOwner}}')"
          test "$(jq -r '.data.repository.databaseId' <<< "$identity")" = 1433701208
          test "$(jq -r '.data.repository.nameWithOwner' <<< "$identity")" = "$REPO"
          node="$(jq -r '.data.repository.id' <<< "$identity")"
          payload="$(jq -cn --arg id "$node" --arg name "$REF" --arg before "$BEFORE" '{query:"mutation($input:UpdateRefsInput!){updateRefs(input:$input){clientMutationId}}",variables:{input:{repositoryId:$id,clientMutationId:"rb91-q3-orphan-cleanup",refUpdates:[{name:$name,beforeOid:$before,afterOid:"0000000000000000000000000000000000000000",force:false}]}}}')"
          printf '%s' "$payload" | gh api graphql --input - > rb91-q3-orphan-cleanup/graphql-result.json
          jq -e '.errors == null and .data.updateRefs.clientMutationId == "rb91-q3-orphan-cleanup"' rb91-q3-orphan-cleanup/graphql-result.json >/dev/null
          set +e
          gh api "repos/${REPO}/git/ref/${REF#refs/}" >/dev/null 2>rb91-q3-orphan-cleanup/negative-read.stderr
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'HTTP 404' rb91-q3-orphan-cleanup/negative-read.stderr
          rm -f rb91-q3-orphan-cleanup/negative-read.stderr
          jq -n --arg ref "$REF" --arg before "$BEFORE" --arg run "$GITHUB_RUN_ID" '{status:"CLEANUP_VERIFIED",ref:$ref,expectedOld:$before,observedAbsentHttp:404,runId:$run,modelInvocations:0,oidcMints:0}' >rb91-q3-orphan-cleanup/receipt.json
      - name: Retain cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rb91-q3-orphan-cleanup-${{ github.run_id }}
          path: rb91-q3-orphan-cleanup/*.json
          if-no-files-found: warn
          retention-days: 90