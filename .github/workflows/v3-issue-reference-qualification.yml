name: V3 Issue reference qualification
on:
  pull_request:
    branches: [feat/issue51-v3-git-file-reference-20261101]
permissions:
  contents: read
  issues: read
jobs:
  qualify:
    if: >-
      github.repository == 'fanilosendrison/review-broker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/issue51-v3-issue-references-20261101' &&
      github.base_ref == 'feat/issue51-v3-git-file-reference-20261101' &&
      github.event.pull_request.user.login == 'fanilosendrison'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - run: python -m pip install .
      - env: {GH_TOKEN: '${{ github.token }}', EXPECTED_HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import os
          from review_broker.github_issue_reference_v3 import GitHubIssueReferenceReaderV3
          from review_broker.identity import artifact_identity,canonical_bytes
          repo="fanilosendrison/review-broker"; rid=1433701208
          authority=artifact_identity(canonical_bytes({"qualification":"same-repository-actions","repository":repo})+b"\n")
          reader=GitHubIssueReferenceReaderV3(os.environ["GH_TOKEN"],repo,rid,authority_evidence_id=authority,qualification_only=True)
          first=reader.observe_issue_body(43); second=reader.observe_issue_body(43)
          comment=reader.observe_issue_comment(6535094733)
          assert first.issue_id==second.issue_id and comment.issue_number==51
          print("AUTHENTICATED_ISSUE_BODY_READ=PASS")
          print("AUTHENTICATED_ISSUE_COMMENT_READ=PASS")
          print("COMMENT_PARENT_ISSUE_IDENTITY=PASS")
          print("BODY_DRIFT="+("OBSERVED" if first.sha256!=second.sha256 else "NONE"))
          print("LIVE_GITHUB_MUTATIONS=0")
          print("LIVE_CODESPACE_EFFECTS=0")
          print("LIVE_INFERENCE=0")
          PY
