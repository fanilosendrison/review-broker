name: Publication recovery

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing validated ReviewRequest issue number
        required: true
        type: number

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: review-broker-single-reviewer
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.issue_number == 28
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install trusted broker
        run: python -m pip install .
      - name: Recover validated publication only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewctl --broker-repo "$GITHUB_REPOSITORY" internal-recover-publication \
            --issue 28 \
            --request 'request:sha256:b7be8e246a6794135979b9e7818c96d8cab59bcfa9c5e7f219683aa316ea260f' \
            --attempt 'attempt:sha256:81b20128c1e1bb4c2263ab64e3ef70b51d5ba79deb40df5fb52ef73eaf7a5702' \
            --packet-id 'packet:sha256:6d3066d097f493be0f4fe1545a5b02f07e77a2c25d089862323975c538545f8c' \
            --artifact-id 12863912132 \
            --artifact-digest 'sha256:6fe42b53aa31f7ed520396b2ba86c40f2f2c0fad1911b1c5d9457ad0c188ac39' \
            --subject-repository 'fanilosendrison/proto-scope' \
            --subject-pr 57 \
            --subject-head '06da37a80c49cd33c6a50c7b6edd256395873a8c'
      - name: Verify official result retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          request='request:sha256:b7be8e246a6794135979b9e7818c96d8cab59bcfa9c5e7f219683aa316ea260f'
          test "$(reviewctl --broker-repo "$GITHUB_REPOSITORY" status --request "$request" | awk -F= '/^STATE=/{print $2}')" = REPORTED
          reviewctl --broker-repo "$GITHUB_REPOSITORY" result --request "$request" --json > result.json
          python - <<'PY'
          import json
          value = json.load(open("result.json", encoding="utf-8"))
          assert value["request_id"] == "request:sha256:b7be8e246a6794135979b9e7818c96d8cab59bcfa9c5e7f219683aa316ea260f"
          assert value["attempt_id"] == "attempt:sha256:81b20128c1e1bb4c2263ab64e3ef70b51d5ba79deb40df5fb52ef73eaf7a5702"
          assert value["packet_id"] == "packet:sha256:6d3066d097f493be0f4fe1545a5b02f07e77a2c25d089862323975c538545f8c"
          PY
