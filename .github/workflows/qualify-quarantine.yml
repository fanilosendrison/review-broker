name: Synthetic quarantine qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Review Broker candidate commit to exercise
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require exact commit identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify checked-out candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run generated synthetic negative and clean controls
        run: |
          python -m pip install .
          mkdir -m 700 synthetic-qualification
          python scripts/actions-quarantine-qualification.py synthetic-qualification
      - name: Upload sanitized incident negative control
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-negative-${{ github.run_id }}-${{ github.run_attempt }}
          path: synthetic-qualification/negative/evidence
          if-no-files-found: error
          retention-days: 7
      - name: Upload clean synthetic control
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-clean-${{ github.run_id }}-${{ github.run_attempt }}
          path: synthetic-qualification/clean/evidence
          if-no-files-found: error
          retention-days: 7
