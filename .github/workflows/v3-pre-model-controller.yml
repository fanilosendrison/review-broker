name: v3 pre-model Controller
run-name: v3 dispatch provider-only qualification

'on':
  workflow_dispatch:
    inputs:
      request_issue_number:
        description: Must be zero; no ReviewRequest Issue is used
        type: number
        required: true
      request_id:
        description: Exact probe caller SHA, not a Review Broker request identity
        type: string
        required: true

permissions: {}

jobs:
  dispatch-provider-probe:
    name: dispatch-provider-probe
    if: >-
      github.repository == 'fanilosendrison/review-broker' &&
      github.repository_id == '1433701208' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      github.actor_id == '30498238' && github.triggering_actor == 'fanilosendrison' &&
      github.ref == 'refs/heads/qualification/issue70-dispatch-provider-20261107t181119z-c31f80' &&
      github.sha == inputs.request_id && inputs.request_issue_number == 0
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact isolated provider-only source
        env:
          EXPECTED_CALLER_SHA: ${{ inputs.request_id }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_CALLER_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_CALLER_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CALLER_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact trusted provider adapter
        run: python -m pip install .
      - name: One job-token dispatch to the inert default Worker stub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_CALLER_SHA: ${{ inputs.request_id }}
        run: >-
          python scripts/qualify-dispatch-provider.py
          --caller-sha "$EXPECTED_CALLER_SHA"
          --caller-ref refs/heads/qualification/issue70-dispatch-provider-20261107t181119z-c31f80
          --dev-sha 671ae588f25464b6ac80bddb44af83b8ca6b9af8
