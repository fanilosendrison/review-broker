name: V3 Actions journal authority qualification

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  qualify:
    if: >-
      github.repository == 'fanilosendrison/review-broker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'qualification/issue51-actions-journal-authority-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_REPOSITORY: fanilosendrison/review-broker
      EXPECTED_HEAD_REF: qualification/issue51-actions-journal-authority-20261030
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_SHA: ${{ github.sha }}
      QUALIFICATION_REF: refs/heads/review-claims-v3/qualification-actions-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Qualify Actions token creation and expected-old CAS authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import threading
          import time
          import urllib.error
          import urllib.request


          API = "https://api.github.com"
          TOKEN = os.environ["GH_TOKEN"]
          REPOSITORY = os.environ["EXPECTED_REPOSITORY"]
          HEAD_REF = os.environ["EXPECTED_HEAD_REF"]
          HEAD_SHA = os.environ["EXPECTED_HEAD_SHA"]
          WORKFLOW_SHA = os.environ["WORKFLOW_SHA"]
          QUALIFICATION_REF = os.environ["QUALIFICATION_REF"]
          RUN_ID = os.environ["GITHUB_RUN_ID"]
          RUN_ATTEMPT = os.environ["GITHUB_RUN_ATTEMPT"]


          def request(method: str, endpoint: str, payload: dict | None = None) -> tuple[int, object]:
              body = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              call = urllib.request.Request(
                  API + endpoint,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "review-broker-v3-actions-authority-qualification",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(call, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      value = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      value = {"message": "NON_JSON_ERROR_RESPONSE"}
                  return error.code, value


          def require(condition: bool, marker: str) -> None:
              if not condition:
                  raise RuntimeError(marker)


          def commit(parent_sha: str, tree_sha: str, label: str) -> str:
              status, value = request(
                  "POST",
                  f"/repos/{REPOSITORY}/git/commits",
                  {
                      "message": f"qualification: synthetic {label} run {RUN_ID}-{RUN_ATTEMPT}",
                      "tree": tree_sha,
                      "parents": [parent_sha],
                  },
              )
              require(status == 201 and isinstance(value, dict), f"COMMIT_{label}_FAILED_{status}")
              sha = value.get("sha")
              require(isinstance(sha, str) and len(sha) == 40, f"COMMIT_{label}_SHA_INVALID")
              return sha


          status, repository = request("GET", f"/repos/{REPOSITORY}")
          require(status == 200 and isinstance(repository, dict), "REPOSITORY_READ_FAILED")
          require(repository.get("full_name") == REPOSITORY, "REPOSITORY_IDENTITY_MISMATCH")
          require(os.environ["GITHUB_REPOSITORY"] == REPOSITORY, "WORKFLOW_REPOSITORY_MISMATCH")
          require(os.environ["GITHUB_HEAD_REF"] == HEAD_REF, "WORKFLOW_BRANCH_MISMATCH")
          require(len(HEAD_SHA) == 40 and len(WORKFLOW_SHA) == 40, "WORKFLOW_SHA_INVALID")
          require(
              QUALIFICATION_REF == f"refs/heads/review-claims-v3/qualification-actions-{RUN_ID}-{RUN_ATTEMPT}",
              "QUALIFICATION_REF_IDENTITY_MISMATCH",
          )
          require(not QUALIFICATION_REF.startswith("refs/heads/review-claims/"), "V1_V2_REF_TARGETED")

          short_ref = QUALIFICATION_REF.removeprefix("refs/")
          status, _ = request("GET", f"/repos/{REPOSITORY}/git/ref/{short_ref}")
          require(status == 404, f"QUALIFICATION_REF_PREEXISTS_{status}")

          status, base_ref = request("GET", f"/repos/{REPOSITORY}/git/ref/heads/dev")
          require(status == 200 and isinstance(base_ref, dict), "DEV_REF_READ_FAILED")
          base_sha = base_ref.get("object", {}).get("sha")
          require(isinstance(base_sha, str) and len(base_sha) == 40, "DEV_SHA_INVALID")
          status, base_commit = request("GET", f"/repos/{REPOSITORY}/git/commits/{base_sha}")
          require(status == 200 and isinstance(base_commit, dict), "DEV_COMMIT_READ_FAILED")
          tree_sha = base_commit.get("tree", {}).get("sha")
          require(isinstance(tree_sha, str) and len(tree_sha) == 40, "DEV_TREE_INVALID")

          commit_a = commit(base_sha, tree_sha, "A")
          commit_b = commit(base_sha, tree_sha, "B")
          require(commit_a != commit_b, "DISTINCT_CREATION_COMMITS_REQUIRED")

          barrier = threading.Barrier(3)
          responses: dict[str, dict] = {}


          def create_ref(writer: str, proposed_sha: str) -> None:
              barrier.wait()
              started_ns = time.monotonic_ns()
              create_status, create_value = request(
                  "POST",
                  f"/repos/{REPOSITORY}/git/refs",
                  {"ref": QUALIFICATION_REF, "sha": proposed_sha},
              )
              finished_ns = time.monotonic_ns()
              message = create_value.get("message") if isinstance(create_value, dict) else None
              responses[writer] = {
                  "status": create_status,
                  "message": message,
                  "proposed_sha": proposed_sha,
                  "started_ns": started_ns,
                  "finished_ns": finished_ns,
              }


          writers = [
              threading.Thread(target=create_ref, args=("A", commit_a), daemon=True),
              threading.Thread(target=create_ref, args=("B", commit_b), daemon=True),
          ]
          for writer in writers:
              writer.start()
          barrier.wait()
          for writer in writers:
              writer.join(timeout=40)
          require(all(not writer.is_alive() for writer in writers), "CREATE_WRITER_TIMEOUT")
          require(set(responses) == {"A", "B"}, "CREATE_RESPONSE_MISSING")

          intervals_overlap = max(value["started_ns"] for value in responses.values()) < min(
              value["finished_ns"] for value in responses.values()
          )
          successes = [writer for writer, value in responses.items() if value["status"] == 201]
          rejections = [writer for writer, value in responses.items() if value["status"] == 422]
          require(intervals_overlap, "CREATE_REQUEST_INTERVALS_DID_NOT_OVERLAP")
          require(len(successes) == 1, "CREATE_SINGLE_WINNER_NOT_OBSERVED")
          require(len(rejections) == 1, "CREATE_ALREADY_EXISTS_REJECTION_NOT_OBSERVED")
          rejected_message = responses[rejections[0]]["message"]
          require(
              isinstance(rejected_message, str) and "Reference already exists" in rejected_message,
              "CREATE_REJECTION_NOT_DEFINITE_ALREADY_EXISTS",
          )

          expected_winner_sha = responses[successes[0]]["proposed_sha"]
          creation_readbacks = []
          for _ in range(10):
              status, winner_ref = request("GET", f"/repos/{REPOSITORY}/git/ref/{short_ref}")
              winner_sha = winner_ref.get("object", {}).get("sha") if isinstance(winner_ref, dict) else None
              creation_readbacks.append({"status": status, "sha": winner_sha})
              if status == 200 and winner_sha == expected_winner_sha:
                  break
              time.sleep(0.5)
          require(
              creation_readbacks[-1] == {"status": 200, "sha": expected_winner_sha},
              "CREATE_WINNER_READBACK_MISMATCH",
          )

          commit_c = commit(expected_winner_sha, tree_sha, "C")
          graphql_status, repository_query = request(
              "POST",
              "/graphql",
              {
                  "query": "query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id nameWithOwner}}",
                  "variables": {"owner": REPOSITORY.split("/", 1)[0], "name": REPOSITORY.split("/", 1)[1]},
              },
          )
          require(graphql_status == 200 and isinstance(repository_query, dict), "GRAPHQL_REPOSITORY_QUERY_FAILED")
          require(not repository_query.get("errors"), "GRAPHQL_REPOSITORY_QUERY_ERRORS")
          repository_node = repository_query.get("data", {}).get("repository", {})
          require(repository_node.get("nameWithOwner") == REPOSITORY, "GRAPHQL_REPOSITORY_IDENTITY_MISMATCH")
          repository_id = repository_node.get("id")
          require(isinstance(repository_id, str) and repository_id, "GRAPHQL_REPOSITORY_ID_MISSING")

          mutation = """mutation($repositoryId:ID!,$name:GitRefname!,$beforeOid:GitObjectID!,$afterOid:GitObjectID!){updateRefs(input:{repositoryId:$repositoryId,refUpdates:[{name:$name,beforeOid:$beforeOid,afterOid:$afterOid,force:false}]}){clientMutationId}}"""
          variables = {
              "repositoryId": repository_id,
              "name": QUALIFICATION_REF,
              "beforeOid": winner_sha,
              "afterOid": commit_c,
          }
          graphql_status, mutation_result = request(
              "POST", "/graphql", {"query": mutation, "variables": variables}
          )
          require(graphql_status == 200 and isinstance(mutation_result, dict), "GRAPHQL_UPDATE_HTTP_FAILED")
          require(not mutation_result.get("errors"), "GRAPHQL_UPDATE_ERRORS")

          update_readbacks = []
          for _ in range(10):
              status, updated_ref = request("GET", f"/repos/{REPOSITORY}/git/ref/{short_ref}")
              observed_sha = updated_ref.get("object", {}).get("sha") if isinstance(updated_ref, dict) else None
              update_readbacks.append({"status": status, "sha": observed_sha})
              if status == 200 and observed_sha == commit_c:
                  break
              time.sleep(0.5)
          require(update_readbacks[-1] == {"status": 200, "sha": commit_c}, "GRAPHQL_UPDATE_READBACK_MISMATCH")

          stale_status, stale_result = request(
              "POST", "/graphql", {"query": mutation, "variables": variables}
          )
          require(stale_status == 200 and isinstance(stale_result, dict), "STALE_REPLAY_HTTP_FAILED")
          require(bool(stale_result.get("errors")), "STALE_REPLAY_NOT_REJECTED")
          status, final_ref = request("GET", f"/repos/{REPOSITORY}/git/ref/{short_ref}")
          require(status == 200 and isinstance(final_ref, dict), "FINAL_REF_READ_FAILED")
          require(final_ref.get("object", {}).get("sha") == commit_c, "STALE_REPLAY_CHANGED_REF")

          evidence = {
              "actions_github_token_graphql_authority": "PASS",
              "base_dev_sha": base_sha,
              "create_responses": responses,
              "create_single_winner": True,
              "creation_readbacks": creation_readbacks,
              "executing_sha": WORKFLOW_SHA,
              "graphql_expected_old_cas": "PASS",
              "head_sha": HEAD_SHA,
              "initial_concurrent_creation": "PASS",
              "intervals_overlap": intervals_overlap,
              "post_update_readbacks": update_readbacks,
              "production_workflow_authority": "UNQUALIFIED",
              "qualification_ref": QUALIFICATION_REF,
              "qualification_ref_final_sha": commit_c,
              "repository": REPOSITORY,
              "run_attempt": RUN_ATTEMPT,
              "run_id": RUN_ID,
              "stale_replay_rejected": True,
          }
          with open("qualification-evidence.json", "w", encoding="utf-8") as output:
              json.dump(evidence, output, indent=2, sort_keys=True)
              output.write("\n")
          print("QUALIFICATION_EVIDENCE=" + json.dumps(evidence, sort_keys=True))
          PY
      - name: Publish bounded evidence summary
        if: always()
        shell: bash
        run: |
          if test -f qualification-evidence.json; then
            {
              echo '```json'
              cat qualification-evidence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve bounded qualification evidence
        if: always() && hashFiles('qualification-evidence.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-actions-journal-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-evidence.json
          if-no-files-found: error
          retention-days: 30
