name: Experimental v3 authority observation qualification

on:
  pull_request:
    branches:
      - feat/issue51-v3-live-github-transport-20261030

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  qualify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue51-v3-authenticated-observations-20261031' &&
      github.event.pull_request.base.ref == 'feat/issue51-v3-live-github-transport-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact executing source
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Install exact executing source
        run: python -m pip install .
      - name: Qualify read-only authenticated observations
        env:
          GH_TOKEN: ${{ github.token }}
          BROKER_REPOSITORY: ${{ github.repository }}
          BROKER_REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNTIME_JOB_KEY: ${{ github.job }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_MERGE_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          from review_broker.github_actions_identity_v3 import (
              GitHubActionsExpectationV3, GitHubActionsIdentityReaderV3,
              GitHubActionsRuntimeClaimV3,
          )
          from review_broker.github_issue_origin_v3 import GitHubIssueOriginReaderV3
          from review_broker.github_journal_transport_v3 import ReadStatusV3
          from review_broker.github_transport_live_v3 import GitHubTransportLiveV3

          repository = os.environ["BROKER_REPOSITORY"]
          repository_id = int(os.environ["BROKER_REPOSITORY_ID"])
          run_id = int(os.environ["RUN_ID"])
          run_attempt = int(os.environ["RUN_ATTEMPT"])
          token = os.environ["GH_TOKEN"]
          workflow_path = ".github/workflows/v3-authority-observation-qualification.yml"

          request = Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:
              initial_run = json.load(response)
          if initial_run.get("path") != workflow_path:
              raise SystemExit("QUALIFICATION_WORKFLOW_PATH_MISMATCH")

          runtime = GitHubActionsRuntimeClaimV3(
              repository=repository,
              repository_id=repository_id,
              run_id=run_id,
              run_attempt=run_attempt,
              job_key=os.environ["RUNTIME_JOB_KEY"],
              workflow_ref=os.environ["WORKFLOW_REF"],
              workflow_sha=os.environ["WORKFLOW_SHA"],
              checked_out_source_sha=os.environ["PR_HEAD_SHA"],
              event_name=os.environ["EVENT_NAME"],
              pull_request_head_sha=os.environ["PR_HEAD_SHA"],
              synthetic_merge_sha=os.environ["EVENT_MERGE_SHA"],
          )

          class ExactBoundary:
              def authenticates(self, candidate):
                  return candidate == runtime

          expected = GitHubActionsExpectationV3(
              repository=repository,
              repository_id=repository_id,
              workflow_id=initial_run["workflow_id"],
              workflow_path=workflow_path,
              workflow_ref=os.environ["WORKFLOW_REF"],
              workflow_execution_ref="refs/heads/" + os.environ["HEAD_REF"],
              event_name="pull_request",
              workflow_definition_sha=os.environ["WORKFLOW_SHA"],
              executing_source_sha=os.environ["PR_HEAD_SHA"],
              job_key="qualify",
              job_name="qualify",
          )
          actions_observation = GitHubActionsIdentityReaderV3(
              token, repository, repository_id
          ).observe(runtime, expected, ExactBoundary())

          issue_observation = GitHubIssueOriginReaderV3(
              token, repository, repository_id
          ).observe(51)

          transport = GitHubTransportLiveV3(
              token, repository, allow_qualification_refs=True
          )
          qualification_ref = (
              "refs/heads/review-claims-v3/"
              "qualification-transport-41190299012-1"
          )
          ref_result = transport.read_claim(qualification_ref)
          if (ref_result.status is not ReadStatusV3.FOUND
                  or ref_result.snapshot is None
                  or ref_result.snapshot.commit_sha
                  != "be49dbd5cbfb44707295387bd96b5b0661a70ef8"):
              raise SystemExit("QUALIFICATION_REF_READ_MISMATCH")
          if transport.mutation_attempt_count != 0:
              raise SystemExit("QUALIFICATION_MUTATION_FORBIDDEN")

          print(json.dumps({
              "issue_origin_observation": "PASS",
              "issue_number": issue_observation.issue_number,
              "issue_id": issue_observation.issue_id,
              "issue_body_sha256": issue_observation.body_sha256,
              "actions_run_identity": "PASS",
              "actions_job_identity": "PASS",
              "run_id": actions_observation.run_id,
              "run_attempt": actions_observation.run_attempt,
              "job_id": actions_observation.job_id,
              "executing_source_sha": actions_observation.executing_source_sha,
              "pull_request_head_sha": actions_observation.pull_request_head_sha,
              "synthetic_merge_sha": actions_observation.synthetic_merge_sha,
              "current_ref_transport_read": "PASS",
              "qualification_ref": qualification_ref,
              "qualification_ref_sha": ref_result.snapshot.commit_sha,
              "qualification_ref_is_valid_v3_journal": False,
              "candidate_code_read_token_boundary": "UNQUALIFIED_FOR_PRODUCTION",
              "operational_actor_authorization": "UNQUALIFIED",
              "production_execution_boundary": "UNQUALIFIED",
              "github_mutations": 0,
              "codespace_effects": 0,
          }, sort_keys=True))
          PY
      - name: Exercise injected journal identity qualification
        run: |
          python -m unittest -v \
            tests.test_github_issue_origin_v3 \
            tests.test_github_actions_identity_v3 \
            tests.test_github_ref_observation_v3
