[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "review-broker"
version = "0.4.15"
description = "Evidence-bound independent review broker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "rfc8785==0.1.4",
]

[project.scripts]
reviewctl = "review_broker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_broker = ["schemas/*.json", "profiles/*.json", "trust/*.json"]
